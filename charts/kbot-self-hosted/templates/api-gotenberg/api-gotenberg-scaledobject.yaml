{{- if and .Values.apiGotenberg.enabled .Values.apiGotenberg.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: scale-gotenberg
  namespace: {{ .Values.global.namespace }}
  annotations:
    autoscaling.keda.sh/paused: "false"
spec:
  scaleTargetRef:
    name: api-gotenberg
    kind: Deployment
  cooldownPeriod: {{ .Values.apiGotenberg.autoscaling.cooldownPeriod }}
  minReplicaCount: {{ .Values.apiGotenberg.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.apiGotenberg.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.apiGotenberg.autoscaling.pollingInterval }}
  triggers:
  - type: metrics-api
    metricType: Value
    metadata:
      url: "http://api-gotenberg.{{ .Values.global.namespace }}.svc.cluster.local:3000/prometheus/metrics"
      format: "prometheus"
      valueLocation: "gotenberg_libreoffice_requests_queue_size"
      aggregateFromKubeServiceEndpoints: "true"
      aggregationType: "max"
      targetValue: "2"
      activationTargetValue: "2"
{{- end }}

